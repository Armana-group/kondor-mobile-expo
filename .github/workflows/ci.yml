name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reproducible install from the committed lockfile.
      # `npm ci` fails if package.json and package-lock.json are out of sync,
      # which enforces that the lockfile is always consistent and vetted.
      - name: Install (reproducible)
        run: npm ci --ignore-scripts

      # Supply-chain gate: fail the build on any high/critical advisory.
      # Moderates are reported but do not block (transitive build-chain).
      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
